[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "song-pattern-workbench"
version = "0.1.0"
description = "A CLI-first retrieval and evaluation workbench for harmonic song patterns."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Isaac Cavallaro" }
]
dependencies = []

[project.scripts]
song-pattern-workbench = "song_pattern_workbench.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

